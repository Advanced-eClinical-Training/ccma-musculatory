:12px 16px;font-weight:600;font-size:15px;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;&lt;span style=&quot;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#5D0159;color:#fff;font-size:12px;margin-right:10px;&quot;&gt;3&lt;/span&gt;Perimysium — tap to reveal&lt;/summary&gt;&lt;p style=&quot;margin:0;padding:0 16px 14px 50px;font-size:15px;line-height:1.5;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;Dense irregular connective tissue that surrounds each fascicle, a bundle of muscle fibers. Blood vessels and nerves travel within it.&lt;/p&gt;&lt;/details&gt;&lt;details style=&quot;background:#fff;border:1.5px solid #EADFD9;border-radius:14px;margin:0 0 8px;&quot;&gt;&lt;summary style=&quot;cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;&lt;span style=&quot;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#5D0159;color:#fff;font-size:12px;margin-right:10px;&quot;&gt;4&lt;/span&gt;Endomysium — tap to reveal&lt;/summary&gt;&lt;p style=&quot;margin:0;padding:0 16px 14px 50px;font-size:15px;line-height:1.5;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;A thin layer of areolar (loose) connective tissue that surrounds each individual muscle fiber (cell).&lt;/p&gt;&lt;/details&gt;&lt;details style=&quot;background:#fff;border:1.5px solid #EADFD9;border-radius:14px;margin:0 0 8px;&quot;&gt;&lt;summary style=&quot;cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;&lt;span style=&quot;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#5D0159;color:#fff;font-size:12px;margin-right:10px;&quot;&gt;5&lt;/span&gt;Myofibril — tap to reveal&lt;/summary&gt;&lt;p style=&quot;margin:0;padding:0 16px 14px 50px;font-size:15px;line-height:1.5;color:#163F4F;font-family:Inter,Arial,sans-serif;&quot;&gt;Contractile rods packed inside each muscle fiber. Repeating sarcomeres of actin and myosin give skeletal muscle its striations.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;
&lt;div class=&quot;a3-tip&quot;&gt;&lt;span class=&quot;a3-tag2&quot;&gt;Exam focus&lt;/span&gt;&lt;p&gt;Work from outside in: &lt;b&gt;epi&lt;/b&gt;mysium (upon) wraps the whole muscle, &lt;b&gt;peri&lt;/b&gt;mysium (around) wraps each fascicle, &lt;b&gt;endo&lt;/b&gt;mysium (within) wraps each muscle fiber. All three merge to form the tendon.&lt;/p&gt;&lt;/div&gt;

(function(){

function tex(draw,w,h){var c=document.createElement(&#x27;canvas&#x27;);c.width=w;c.height=h;draw(c.getContext(&#x27;2d&#x27;),w,h);var t=new T.CanvasTexture(c);t.anisotropy=4;return t;}

  for(var y=0;y&lt;h;y+=17){for(var x=(y/17%2)*8;x&lt;w;x+=17){g.beginPath();g.ellipse(x+r()*3,y+r()*3,7+r()*1.5,7+r()*1.5,r()*3,0,6.3);g.fillStyle=[&#x27;#7A2324&#x27;,&#x27;#8A2B2A&#x27;,&#x27;#6C1E20&#x27;][Math.floor(r()*3)];g.fill();}}},256,256);

var M={bone:new T.MeshStandardMaterial({map:bumpTex,roughness:0.85}),
  boneEnd:new T.MeshStandardMaterial({color:0xC9BB98,roughness:0.95}),

  bundle:new T.MeshStandardMaterial({map:stripeTex,roughness:0.6}),

var G=new T.Group();scene.add(G);
function cylX(r1,r2,x1,x2,mat,seg,open){var g=new T.CylinderGeometry(r2,r1,x2-x1,seg||48,1,!!open);var m=new T.Mesh(g,mat);m.rotation.z=-Math.PI/2;m.position.x=(x1+x2)/2;G.add(m);return m;}
// bone
var bone=new T.Mesh(new T.CylinderGeometry(0.55,0.6,5.2,40),[M.bone,M.boneEnd,M.boneEnd]);bone.position.set(-3.55,0.2,-0.2);bone.rotation.z=0.18;G.add(bone);
// tendon (tapered) and muscle belly (epimysium)
cylX(0.28,1.25,-3.1,-1.7,M.sheath);
cylX(1.25,1.55,-1.7,-0.4,M.sheath);
cylX(1.55,1.55,-0.4,1.4,M.sheath,64,true);
// cut face: background disc + fascicles
var bg=new T.Mesh(new T.CircleGeometry(1.53,64),M.faceBg);bg.rotation.y=Math.PI/2;bg.position.x=1.39;G.add(bg);
var fasc=[];for(var k=0;k&lt;6;k++){var a=k*Math.PI/3;fasc.push([0.75*Math.cos(a),0.75*Math.sin(a)]);var b2=a+Math.PI/6;fasc.push([1.18*Math.cos(b2),1.18*Math.sin(b2)]);}
fasc.forEach(function(p,i){var c=new T.Mesh(new T.CylinderGeometry(0.36,0.36,0.14,7),[M.peri,M.face,M.face]);
  c.rotation.z=-Math.PI/2;c.rotation.x=i*0.7;c.position.set(1.46,p[1],p[0]);G.add(c);});
// extended fascicle (perimysium) with fiber face
var fx=new T.Mesh(new T.CylinderGeometry(0.36,0.38,3.8,7,1,false),[M.peri,M.face,M.face]);fx.rotation.z=-Math.PI/2;fx.position.set(3.3,0,0);G.add(fx);

cylX(0.13,0.13,5.2,7.1,M.endo,32);
cylX(0.115,0.115,7.1,7.55,M.bundle,32);
cylX(0.04,0.04,7.55,8.7,M.fibril,16);

G.rotation.set(0.14,-0.82,-0.3);G.updateMatrixWorld();var bb=new T.Box3().setFromObject(G),ctr=bb.getCenter(new T.Vector3());G.position.sub(ctr);

var HS=[
 {n:1,name:&#x27;Tendon&#x27;,p:[-2.55,0.62,0.1],o:[-170,-10],def:&#x27;Dense regular connective tissue that attaches muscle to bone. It forms where the three connective tissue sheaths converge.&#x27;},
 {n:2,name:&#x27;Epimysium&#x27;,p:[0.2,1.55,0.2],o:[60,-70],def:&#x27;Dense irregular connective tissue that surrounds the entire muscle. It blends with the tendon.&#x27;},
 {n:3,name:&#x27;Perimysium&#x27;,p:[3.2,0.38,0.05],o:[70,-80],def:&#x27;Dense irregular connective tissue that surrounds each fascicle, a bundle of muscle fibers. Blood vessels and nerves travel within it.&#x27;},
 {n:4,name:&#x27;Endomysium&#x27;,p:[6.1,0.14,0.02],o:[50,-70],def:&#x27;A thin layer of areolar (loose) connective tissue that surrounds each individual muscle fiber (cell).&#x27;},
 {n:5,name:&#x27;Myofibril&#x27;,p:[8.2,0.05,0],o:[40,50],oo:[40,-130],def:&#x27;Contractile rods packed inside each muscle fiber. Repeating sarcomeres of actin and myosin give skeletal muscle its striations.&#x27;}];
var labels=root.querySelector(&#x27;#a3-labels&#x27;),lines=root.querySelector(&#x27;#a3-lines&#x27;),open=null;
HS.forEach(function(h){
  h.v=new T.Vector3(h.p[0],h.p[1],h.p[2]);
  h.dot=document.createElement(&#x27;button&#x27;);h.dot.type=&#x27;button&#x27;;h.dot.className=&#x27;a3-dot&#x27;;h.dot.textContent=h.n;
  h.dot.setAttribute(&#x27;aria-label&#x27;,h.n+&#x27;: &#x27;+h.name+&#x27; — show definition&#x27;);h.dot.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
  h.tag=document.createElement(&#x27;div&#x27;);h.tag.className=&#x27;a3-tag&#x27;;h.tag.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);h.tag.tabIndex=0;h.tag.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
  h.tag.innerHTML=&#x27;&lt;button class=&quot;a3-x&quot; type=&quot;button&quot; aria-label=&quot;Close&quot;&gt;×&lt;/button&gt;&lt;span&gt;&#x27;+h.name+&#x27;&lt;/span&gt;&lt;div class=&quot;a3-def&quot;&gt;&#x27;+h.def+&#x27;&lt;/div&gt;&#x27;;
  h.line=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;line&#x27;);h.line.setAttribute(&#x27;stroke&#x27;,&#x27;#163F4F&#x27;);h.line.setAttribute(&#x27;stroke-width&#x27;,&#x27;1.5&#x27;);lines.appendChild(h.line);

});
